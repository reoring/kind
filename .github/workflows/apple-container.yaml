name: Apple Container

# The Apple container runtime needs the Virtualization framework, which is
# not available on GitHub-hosted macOS runners (they are themselves VMs and
# nested virtualization is unsupported). This workflow is therefore manual,
# intended for self-hosted Apple silicon runners running macOS 26+.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner label to use (needs macOS 26+ on Apple silicon with virtualization support)"
        required: false
        default: "macos-26"

permissions:
  contents: read

jobs:
  apple-container:
    name: Apple Container
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deployment: [singleNode, multiNode]
    env:
      JOB_NAME: "apple-container-${{ matrix.deployment }}"
      CONTAINER_VERSION: "1.0.0"
      KIND_EXPERIMENTAL_PROVIDER: "container"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get go version
        id: golangversion
        run: |
          echo "go_version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ steps.golangversion.outputs.go_version }}
          check-latest: true

      - name: Install kind
        run: sudo make install INSTALL_DIR=/usr/local/bin

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/darwin/arm64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install Apple container
        run: |
          curl -LO "https://github.com/apple/container/releases/download/${CONTAINER_VERSION}/container-${CONTAINER_VERSION}-installer-signed.pkg"
          sudo installer -pkg "container-${CONTAINER_VERSION}-installer-signed.pkg" -target /
          container system start --enable-kernel-install
          container system status
          container --version

      - name: Set up the local DNS domain
        if: ${{ matrix.deployment == 'multiNode' }}
        run: |
          sudo container system dns create kind
          mkdir -p ~/.config/container
          cat >> ~/.config/container/config.toml <<EOF
          [dns]
          domain = "kind"
          EOF
          container system stop
          container system start --enable-kernel-install
          container system dns ls

      - name: Create single node cluster
        if: ${{ matrix.deployment == 'singleNode' }}
        run: |
          /usr/local/bin/kind create cluster -v7 --wait 1m --retain

      - name: Create multi node cluster
        if: ${{ matrix.deployment == 'multiNode' }}
        run: |
          cat <<EOF | /usr/local/bin/kind create cluster -v7 --wait 1m --retain --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          EOF

      - name: Get Cluster status
        run: |
          kubectl wait --for=condition=ready pods --namespace=kube-system -l k8s-app=kube-dns
          kubectl get nodes -o wide
          kubectl get pods -A

      - name: Load image archive
        run: |
          container image pull --platform linux/arm64 docker.io/library/busybox:stable
          container image save --platform linux/arm64 docker.io/library/busybox:stable --output busybox.tar
          /usr/local/bin/kind load image-archive busybox.tar

      - name: Restart node VMs
        run: |
          for node in $(/usr/local/bin/kind get nodes); do container stop "$node"; done
          for node in $(/usr/local/bin/kind get nodes); do container start "$node"; done
          # wait for the API server to come back before waiting on nodes
          for i in $(seq 1 36); do kubectl get nodes >/dev/null 2>&1 && break; sleep 5; done
          kubectl wait --for=condition=ready nodes --all --timeout=180s
          kubectl get nodes -o wide

      - name: Export logs
        if: always()
        run: |
          mkdir -p /tmp/kind/logs
          /usr/local/bin/kind export logs /tmp/kind/logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}
          path: /tmp/kind/logs

      - name: Delete cluster
        run: /usr/local/bin/kind delete cluster
